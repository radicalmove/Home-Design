[workspace]
resolver = "2"
members = [
  "crates/home-design-core",
  "crates/home-design-desktop",
  "apps/desktop-ui/src-tauri",
]

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.88"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = "2"
tauri-build = "2"
